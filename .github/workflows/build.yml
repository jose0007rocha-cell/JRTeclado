name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Remover arquivos antigos que sobraram no repositorio
        run: |
          cd app/src/main/java/com/jrocha/teclado
          rm -f ColorDialog.java CoverDrawable.java FxView.java TelaActivity.java TemaStore.java
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JRTeclado-apk
          path: app/build/outputs/apk/debug/*.apk
